<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgroFrotas</title>
    <style>
      :root {
        --bg: #f4f1eb;
        --panel: #ffffff;
        --text: #1a100b;
        --muted: #666666;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      .loading {
        width: min(92vw, 420px);
        background: var(--panel);
        border-radius: 18px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        padding: 28px 24px;
        text-align: center;
      }

      .logo {
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 12px;
      }

      .text {
        color: var(--muted);
        line-height: 1.5;
        margin: 0;
      }

      .spinner {
        width: 36px;
        height: 36px;
        margin: 18px auto 0;
        border: 4px solid rgba(0,0,0,0.08);
        border-top-color: #1a100b;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="loading">
      <div class="logo">AgroFrotas</div>
      <p class="text">Abrindo o app configurado...</p>
      <div class="spinner" aria-label="Carregando"></div>
    </div>

    <script>
      const appUrl = 'https://agro-frotas-copy-621ac834.base44.app';
      window.location.href = appUrl;
    </script>
  </body>
</html>
